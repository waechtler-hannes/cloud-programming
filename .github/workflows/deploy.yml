name: Build and Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Configuration from terraform.tfvars.json
        id: config
        run: |
          CONFIG_FILE="terraform/terraform.tfvars.json"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Fehler: Konfigurationsdatei $CONFIG_FILE nicht gefunden!"
            exit 1
          fi

          AWS_REGION=$(jq -r .region "$CONFIG_FILE")
          BUCKET_NAME=$(jq -r .bucket_name "$CONFIG_FILE")

          if [ -z "$AWS_REGION" ] || [ "$AWS_REGION" == "null" ]; then
            echo "Fehler: 'region' konnte nicht aus $CONFIG_FILE gelesen werden!"
            exit 1
          fi

          if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" == "null" ]; then
            echo "Fehler: 'bucket_name' konnte nicht aus $CONFIG_FILE gelesen werden!"
            exit 1
          fi

          echo "Gelesene Region: $AWS_REGION"
          echo "Gelesener Bucket-Name: $BUCKET_NAME"

          echo "aws_region=$AWS_REGION" >> "$GITHUB_OUTPUT"

          echo "S3_BUCKET_NAME=$BUCKET_NAME" >> "$GITHUB_ENV"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.config.outputs.aws_region }}

      - name: Resolve CloudFront Distribution ID
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?contains(DomainName, '$S3_BUCKET_NAME')]].Id | [0]" \
            --output text)

          if [ "$DIST_ID" == "None" ] || [ -z "$DIST_ID" ]; then
            echo "Fehler: Keine aktive Distribution für Bucket $S3_BUCKET_NAME gefunden!"
            exit 1
          fi
          echo "Gefundene Distribution-ID: $DIST_ID"
          echo "CLOUDFRONT_DISTRIBUTION_ID=$DIST_ID" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install & Build Webpack
        working-directory: ./website
        run: |
          npm ci
          npm run build

      - name: Sync Website to S3
        run: |
          aws s3 sync ./website/dist s3://${{ env.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"