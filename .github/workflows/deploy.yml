name: Build and Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve Dynamic AWS Parameters
        run: |
          BUCKET_NAME=$(grep -A 5 'variable "bucket_name"' terraform/variables.tf | grep 'default' | awk -F '"' '{print $2}')
          
          if [ -z "$BUCKET_NAME" ]; then
            echo "Fehler: Konnte S3_BUCKET_NAME nicht aus terraform/variables.tf lesen!"
            exit 1
          fi
          echo "Extrahierter Bucket-Name: $BUCKET_NAME"
          echo "S3_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?contains(DomainName, '$BUCKET_NAME')]].Id | [0]" \
            --output text)

          if [ "$DIST_ID" == "None" ] || [ -z "$DIST_ID" ]; then
            echo "Fehler: Keine aktive Distribution für Bucket $BUCKET_NAME gefunden!"
            exit 1
          fi
          echo "Gefundene Distribution-ID: $DIST_ID"
          echo "CLOUDFRONT_DISTRIBUTION_ID=$DIST_ID" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install & Build Webpack
        working-directory: ./website
        run: |
          npm ci
          npm run build

      - name: Sync Website to S3
        run: |
          aws s3 sync ./website/dist s3://${{ env.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"