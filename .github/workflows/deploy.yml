name: Build and Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. AWS Credentials konfigurieren (nur Access Key, Secret Key, Region als Secret)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 2. Bucket-Name aus variables.tf lesen & CloudFront Distribution via jq auflösen
      - name: Resolve Dynamic AWS Parameters
        run: |
          BUCKET_NAME=$(grep -A 5 'variable "bucket_name"' terraform/variables.tf | grep 'default' | awk -F '"' '{print $2}')
          
          if [ -z "$BUCKET_NAME" ]; then
            echo "Fehler: Konnte S3_BUCKET_NAME nicht aus variables.tf lesen!"
            exit 1
          fi
          echo "Extrahierter Bucket-Name: $BUCKET_NAME"
          echo "S3_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

          DIST_ID=$(aws cloudfront list-distributions --output json | jq -r \
            --arg BUCKET "$BUCKET_NAME" \
            '.DistributionList.Items[]? | select(.Origins.Items[]?.DomainName | contains($BUCKET)) | .Id' | head -n 1)

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" == "null" ]; then
            echo "Kein exakter Origin-Treffer für $BUCKET_NAME – wähle die erste Distribution im Account..."
            DIST_ID=$(aws cloudfront list-distributions --output json | jq -r '.DistributionList.Items[0].Id // empty')
          fi

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" == "null" ]; then
            echo "Fehler: Es konnte überhaupt keine CloudFront-Distribution im AWS-Account gefunden werden!"
            exit 1
          fi

          echo "Gefundene Distribution-ID: $DIST_ID"
          echo "CLOUDFRONT_DISTRIBUTION_ID=$DIST_ID" >> $GITHUB_ENV

      # 3. Webpack installieren und bauen
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install & Build Webpack
        working-directory: ./website
        run: |
          npm ci
          npm run build

      # 4. Upload nach S3
      - name: Sync Website to S3
        run: |
          aws s3 sync ./website/dist s3://${{ env.S3_BUCKET_NAME }} --delete

      # 5. Invalidation mit der dynamisch ermittelten ID
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"